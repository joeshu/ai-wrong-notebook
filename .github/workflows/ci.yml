name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --machine --no-fatal-warnings --no-fatal-infos > analyzer.txt 2>&1
          status=$?
          while IFS= read -r message; do
            [[ "$message" != *"error •"* ]] && continue
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=Flutter Analyzer::$message"
          done < analyzer.txt
          exit "$status"

      - name: Run tests
        shell: bash
        run: |
          set +e
          flutter test --machine > test-results.jsonl 2>&1
          status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines = Path('test-results.jsonl').read_text(errors='replace').splitlines()
          tests = {}
          events = []
          for raw in lines:
              try:
                  event = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if event.get('type') == 'testStart':
                  test = event.get('test') or {}
                  tests[test.get('id')] = test.get('name', test.get('url', 'unknown test'))
              events.append(event)
          emitted = 0
          for event in events:
              if event.get('type') == 'error':
                  message = str(event.get('error', 'Test error'))
                  stack = str(event.get('stackTrace', '')).splitlines()[:8]
                  body = '\n'.join([message, *stack])
              elif event.get('type') == 'testDone' and event.get('result') not in ('success', 'skipped'):
                  test_id = event.get('testID')
                  body = f"Test failed: {tests.get(test_id, test_id)} ({event.get('result')})"
              else:
                  continue
              body = body.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Flutter Test::{body}')
              emitted += 1
          if emitted == 0:
              tail = '\n'.join(lines[-50:])[-7000:]
              tail = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Flutter Test raw output::{tail}')
          PY
          exit "$status"
