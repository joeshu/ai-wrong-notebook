name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --machine --no-fatal-warnings --no-fatal-infos > analyzer.txt 2>&1
          status=$?
          while IFS= read -r message; do
            [[ "$message" != *"error •"* ]] && continue
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=Flutter Analyzer::$message"
          done < analyzer.txt
          exit "$status"

      - name: Run tests
        shell: bash
        run: |
          set +e
          flutter test --machine > test-results.jsonl 2>&1
          status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          for raw in Path('test-results.jsonl').read_text(errors='replace').splitlines():
              try:
                  event = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if event.get('type') == 'error':
                  message = str(event.get('error', 'Test error'))
                  stack = str(event.get('stackTrace', '')).splitlines()[:6]
                  body = '\n'.join([message, *stack])
              elif event.get('type') == 'testDone' and event.get('result') not in ('success', 'skipped'):
                  body = f"Test failed: {event.get('testID')} ({event.get('result')})"
              else:
                  continue
              body = body.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Flutter Test::{body}')
          PY
          exit "$status"
