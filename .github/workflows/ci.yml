name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --machine --no-fatal-warnings --no-fatal-infos > analyzer.txt
          status=$?
          while IFS='|' read -r severity type code file line column length message correction; do
            if [[ "$severity" == "ERROR" ]]; then
              echo "::error file=$file,line=$line,col=$column::$message [$code]"
            fi
          done < analyzer.txt
          exit "$status"

      - name: Run tests
        run: flutter test
